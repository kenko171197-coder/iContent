<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Studio566</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  html, body { height: 100%; margin: 0; background: #0b0a09; color: #bab2a6; font: 13px/1.5 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  body { display: grid; place-items: center; background: radial-gradient(700px 360px at 50% 38%, rgba(255, 184, 61, .07), transparent 70%), #0b0a09; }
  main { display: flex; flex-direction: column; align-items: center; gap: 16px; animation: in .4s cubic-bezier(.22, .9, .24, 1) both; }
  img { width: 64px; height: 64px; filter: drop-shadow(0 10px 30px rgba(255, 178, 36, .3)); }
  h1 { margin: 0; color: #f5f1ea; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .bar { width: 168px; height: 3px; border-radius: 3px; background: rgba(255, 244, 228, .09); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #ffb432; animation: slide 1.15s ease-in-out infinite; }
  p { margin: 0; min-height: 20px; text-align: center; max-width: 420px; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Studio566</h1>
  <div class="bar" id="bar"><i></i></div>
  <p id="msg">Đang khởi động</p>
</main>
<script>
  // tải một ảnh từ máy chủ để biết máy chủ đã chạy: cách này không vướng quy tắc chặn của trình duyệt giữa file và http
  const to = new URLSearchParams(location.search).get('to') || 'http://127.0.0.1:8765';
  const started = Date.now();
  function probe() {
    const im = new Image();
    im.onload = () => location.replace(to);
    im.onerror = () => {
      // không bao giờ bỏ cuộc: máy chậm khởi động lâu thì máy chủ vẫn lên, nếu ngừng dò thì không ai vào được nữa
      if (Date.now() - started > 45000) document.getElementById('msg').textContent = 'Vẫn đang khởi động, lần đầu có thể lâu hơn. Nếu đợi quá lâu, mở Sửa lỗi Studio566 trong menu Start.';
      setTimeout(probe, 350);
    };
    im.src = to + '/static/icon.png?t=' + Date.now();
  }
  probe();
  // Studio566 không mở được: biểu tượng (icontent/start.py) mở công cụ Sửa lỗi ở cổng 8766 và chỉ trả ảnh này khi đó;
  // cửa sổ này chuyển luôn sang trang Sửa lỗi thay vì đứng chờ mãi
  function handoff() {
    const im = new Image();
    im.onload = () => location.replace('http://127.0.0.1:8766/');
    im.onerror = () => setTimeout(handoff, 1500);
    im.src = 'http://127.0.0.1:8766/handoff.png?t=' + Date.now();
  }
  setTimeout(handoff, 1500);
</script>
</body>
</html>
